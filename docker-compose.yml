version: "3.9"
services:
  api:
    build: ./backend
    container_name: forex_api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: forex_frontend
    ports:
      - "80:80"
    restart: unless-stopped
